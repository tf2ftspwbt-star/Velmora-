name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepara www
        run: |
          mkdir -p www
          cp -f index.html manifest.json sw.js icon-180.png icon-512.png www/ || true
          cp -f slash.m4a theme.m4a hero.glb www/ || true
          ls -la www

      - name: Dipendenze
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          cd ios/App
          if [ -f Podfile ]; then pod install; fi
          ls -la

      - name: Compila senza firma
        run: |
          cd ios/App
          if [ -f App.xcworkspace/contents.xcworkspacedata ]; then
            TARGET="-workspace App.xcworkspace"
          else
            TARGET="-project App.xcodeproj"
          fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER=it.velmora.app \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Crea IPA
        run: |
          APP=$(find ios/App/build -name "*.app" -type d | head -n 1)
          echo "Trovato: $APP"
          test -n "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/Velmora.app
          zip -r Velmora.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Velmora-ipa
          path: Velmora.ipa
