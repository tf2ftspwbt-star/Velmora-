<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070b16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Velmora" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>VELMORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#070b16; --bg2:#0c1222; --card:#121a2e; --line:#2a3550; --soft:#1e2740;
      --text:#f3efe6; --muted:#8b93a7; --copper:#e8a54b; --teal:#4ecdc4; --rose:#e85d4c;
      --nav: calc(64px + env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
    #app{height:100%;max-width:430px;margin:0 auto;position:relative;background:var(--bg2);display:flex;flex-direction:column}
    .screen{flex:1;overflow-y:auto;padding:12px 12px calc(var(--nav) + 10px);scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);
      background:#0a1020;border-top:1px solid var(--soft);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
    .nav button{background:0;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.12em;font-weight:600}
    .nav button.on{color:var(--copper)}
    .nav svg{width:22px;height:22px}
    .card,.row,.seg button{background:var(--card);border:1px solid var(--line);border-radius:16px}
    .card{padding:14px}
    .row{padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
    .seg button{padding:11px 6px;color:var(--muted);font-size:11px;font-weight:600}
    .seg button small{display:block;font-weight:400;opacity:.7;margin-top:2px;font-size:9px;letter-spacing:.08em}
    .seg button.on{background:#1c160a;border-color:var(--copper);color:var(--copper)}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:13px}
    .btn-c{background:var(--copper);color:#1a1204}
    .btn-g{background:#161e32;color:var(--text);border:1px solid var(--line)}
    .locked{opacity:.45}
    .kicker{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
    .toast{position:absolute;left:16px;right:16px;bottom:calc(var(--nav)+10px);background:#1a1408;border:1px solid #b67a28;color:var(--copper);padding:10px;border-radius:12px;font-size:12px;text-align:center;display:none;z-index:30}

    /* 3D stage */
    #stage{position:relative;height:268px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a1420;margin-bottom:10px}
    #c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hud{position:absolute;inset:0;pointer-events:none;z-index:2}
    .hud > *{pointer-events:auto}
    .hp-wrap{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:8px;align-items:center}
    .hp{flex:1;height:8px;background:#1a1020;border-radius:99px;overflow:hidden;border:1px solid #2a2030}
    .hp > i{display:block;height:100%;width:100%;transition:width .25s}
    .hp.ally i{background:linear-gradient(90deg,#4ecdc4,#6fbf73)}
    .hp.foe i{background:linear-gradient(90deg,#e85d4c,#c23b4a)}
    .float{position:absolute;font-weight:800;font-size:15px;text-shadow:0 2px 6px #000;animation:up 700ms ease-out forwards;pointer-events:none}
    @keyframes up{to{transform:translateY(-46px);opacity:0}}
    .pill{position:absolute;background:rgba(7,11,22,.82);border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-size:11px;backdrop-filter:blur(8px)}
    .fabcol{position:absolute;right:8px;top:48px;display:flex;flex-direction:column;gap:6px}
    .fab{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(7,11,22,.8);color:#fff;display:grid;place-items:center}

    /* paper doll */
    .doll{position:relative;height:390px;margin:6px 0 10px}
    .piece{position:absolute;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
    .glyph{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;font-size:28px;
      background:#0e1628;border:1px solid #2a3550;position:relative}
    .glyph b{position:absolute;right:-6px;bottom:-6px;min-width:22px;height:20px;padding:0 5px;border-radius:8px;
      background:#121a2e;border:1px solid #2a3550;font-size:11px;display:grid;place-items:center}
    .r0 .glyph{border-color:#4a5568}
    .r1 .glyph{border-color:#9aa4b5;box-shadow:0 0 12px #9aa4b544}
    .r2 .glyph{border-color:#6fbf73;box-shadow:0 0 16px #6fbf7366}
    .r3 .glyph{border-color:#5ad0ff;box-shadow:0 0 18px #3db7ff88}
    .r4 .glyph{border-color:#b48cff;box-shadow:0 0 20px #8b7cff88}
    .r5 .glyph{border-color:#e85d4c;box-shadow:0 0 20px #e85d4c77}
    .r6 .glyph{border-color:#e8a54b;box-shadow:0 0 22px #e8a54b99}
    .r7 .glyph{border-color:#4ecdc4;box-shadow:0 0 24px #e8a54bcc,0 0 36px #4ecdc466}
    .empty .glyph{border-style:dashed;border-color:#2a3550;background:#0a101c;box-shadow:none;opacity:.7}
    .ico{width:28px;height:28px;display:block}
    .sheet{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
    .sheet.on{display:flex}
    .sheet .panel{width:100%;max-width:430px;background:#10182c;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
    .stars{letter-spacing:2px;color:var(--copper)}
    .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  </style>
</head>
<body>
<div id="app">
  <div id="view" class="screen"></div>
  <nav class="nav">
    <button class="on" data-tab="hunt" onclick="go('hunt')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19 L14 5 M9 5 h5 v5 M16 14 l4 6 H8z"/></svg>CACCIA</button>
    <button data-tab="char" onclick="go('char')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 l7 4 v6 c0 5-3 8-7 9-4-1-7-4-7-9V7z"/></svg>EROE</button>
    <button data-tab="world" onclick="go('world')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18 V9 l8-5 8 5 v9 H4z M9 18 v-6 h6 v6"/></svg>REAME</button>
    <button data-tab="clash" onclick="go('clash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 c3 3 5 6 5 10a5 5 0 1 1-10 0c0-4 2-7 5-10z"/></svg>LIZZA</button>
  </nav>
  <div class="toast" id="toast"></div>
  <div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"></div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const RAR = [
  {id:0,n:'Comune',col:'#9aa4b5'},
  {id:1,n:'Temprato',col:'#d0d6e0'},
  {id:2,n:'Runico',col:'#6fbf73'},
  {id:3,n:'Ancestrale',col:'#5ad0ff'},
  {id:4,n:'Draconico',col:'#b48cff'},
  {id:5,n:'Abissale',col:'#e85d4c'},
  {id:6,n:'Stellare',col:'#e8a54b'},
  {id:7,n:'Eclisseforgiato',col:'#4ecdc4'}
];

const SLOTS = {
  helm:     {slot:'Elmo',      svg:'helm'},
  shoulder: {slot:'Spallacci', svg:'shoulders'},
  chest:    {slot:'Corazza',   svg:'chest'},
  legs:     {slot:'Gambali',   svg:'legs'},
  boots:    {slot:'Stivali',   svg:'boots'},
  weapon:   {slot:'Arma',      svg:'sword'},
  shield:   {slot:'Scudo',     svg:'shield'},
  ring:     {slot:'Anello',    svg:'ring'},
  amulet:   {slot:'Amuleto',   svg:'amulet'}
};
const NAMES = {
  0:{
    helm:['Elmo di Stracci','Cuffia di Ferro','Elmo di Bruma'],
    shoulder:['Stracci alle Spalle','Guardie Spezzate','Spalline di Rame'],
    chest:['Camicia Rovinata','Cotta del Fiume','Corazza di Scaglie'],
    legs:['Panni da Strada','Greave di Rame','Gambali Temprati'],
    boots:['Piedi Nudi Fasciati','Stivali di Cuoio','Passo della Cascata'],
    weapon:['Ramo Nodoso','Lama di Ruggine','Spada del Vespero'],
    shield:['Coperchio di Botte','Baluardo Azzurro','Scudo di Quercia'],
    ring:['Anello di Spago','Anello del Pozzo','Sigillo di Rame'],
    amulet:['Dente di Cinghiale','Cuore di Muschio','Pendente del Pozzo']
  },
  1:{
    helm:['Elmo di Polvere','Casco da Minatore','Elmo di Scorie'],
    shoulder:['Spalle di Iuta','Paraspalle di Piccone','Guardie di Ferrovecchio'],
    chest:['Giubba di Cava','Cotta di Maglia Rotta','Corazza di Scorie'],
    legs:['Pantaloni di Polvere','Gambali di Catena','Greave di Ferrovecchio'],
    boots:['Scarponi di Fango','Stivali da Pozzo','Passo della Galleria'],
    weapon:['Piccone Spezzato','Lama di Scorie','Spada di Ferrovecchio'],
    shield:['Targa di Legno Minato','Scudo di Carrello','Baluardo di Scorie'],
    ring:['Anello di Carbone','Fedina del Pozzo','Sigillo di Ferrovecchio'],
    amulet:['Ciondolo di Quarzo','Cuore di Miniera','Pendente di Scorie']
  },
  2:{
    helm:['Elmo Fessurato','Elmo della Crepa','Elmo Eclissato'],
    shoulder:['Spalle di Scheggia','Guardie della Fenditura','Spallacci Eclissati'],
    chest:['Cotta Fessurata','Corazza della Crepa','Piastra Eclissata'],
    legs:['Gambali Fessurati','Greave della Crepa','Gambiere Eclissate'],
    boots:['Stivali Fessurati','Passo della Crepa','Passo Eclissato'],
    weapon:['Scheggia di Fenditura','Lama della Crepa','Spada Eclissata'],
    shield:['Targa Fessurata','Scudo della Crepa','Baluardo Eclissato'],
    ring:['Anello Fessurato','Sigillo della Crepa','Anello Eclissato'],
    amulet:['Scheggia al Collo','Cuore della Crepa','Pendente Eclissato']
  }
};

const S = {
  tab:'hunt', sub:'gear',
  name:'Vesper', lv:1, xp:0, xpMax:120,
  energy:20, energyMax:20, gems:0, crowns:12, dust:0,
  auto:false, fighting:false,
  hp:100, ehp:100,
  pet:null,
  bag:[],
  zone:0,
  wins:0,
  gear:{ helm:null, shoulder:null, chest:null, legs:null, boots:null, weapon:null, ring:null, shield:null, amulet:null }
};
const ZONES = [
  {id:0, n:'Bosco del Falò', need:1, hp:100, hit:6, xp:25, drop:0},
  {id:1, n:'Miniera Abbandonata', need:5, hp:145, hit:11, xp:40, drop:1},
  {id:2, n:'Fenditura', need:12, hp:200, hit:16, xp:60, drop:2}
];

function svgIco(kind, col='#c9d0dc'){
  const p = {
    helm:'M4 14 L4 10 Q12 2 20 10 L20 14 L16 16 L8 16 Z',
    shoulders:'M3 10 L8 6 L10 12 L3 14 Z M21 10 L16 6 L14 12 L21 14 Z',
    chest:'M8 4 L16 4 L19 8 L17 20 L7 20 L5 8 Z',
    legs:'M8 4 H16 V8 L14 20 H10 L8 8 Z',
    boots:'M5 8 H15 V14 H19 L20 18 H4 Z',
    sword:'M12 2 L14 4 L13 14 L16 20 L8 20 L11 14 Z',
    shield:'M12 2 L20 6 V12 C20 17 12 22 12 22 C12 22 4 17 4 12 V6 Z',
    ring:'M12 7 a5 5 0 1 0 .1 0 M12 9 a3 3 0 1 0 .1 0',
    amulet:'M12 3 L13 8 L12 10 L11 8 Z M12 10 C8 12 8 18 12 20 C16 18 16 12 12 10'
  };
  return `<svg class="ico" viewBox="0 0 24 24" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="1.6" stroke-linejoin="round">${p[kind]?`<path d="${p[kind]}"/>`:'<circle cx="12" cy="12" r="6"/>'}</svg>`;
}

let three = {ready:false, raf:0};

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._i);t._i=setTimeout(()=>t.style.display='none',1600)}
function power(){
  const base = 40 + S.lv*8;
  return Object.values(S.gear).reduce((a,g)=> g ? a + g.ilvl*8 + g.plus*12 + g.atk*3 + g.def*2 + g.r*20 : a, base);
}
function go(tab,sub){
  S.tab=tab; if(sub) S.sub=sub;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  stopThree();
  render();
  if(tab==='hunt') requestAnimationFrame(bootThree);
}

/* ---------- Three.js stage ---------- */
function stopThree(){
  three.ready=false;
  cancelAnimationFrame(three.raf);
  if(three.renderer){ three.renderer.dispose(); three.renderer.domElement.remove(); three.renderer=null; }
}
function mat(color, metal=0.4){ return new THREE.MeshStandardMaterial({color, metalness:metal, roughness:0.45}); }
function addGlow(obj, color){
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.12}));
  s.scale.set(1.4,1.8,1.4); obj.add(s);
}
function rarityHex(r){
  return [0x9aa4b5,0xd0d6e0,0x6fbf73,0x5ad0ff,0xb48cff,0xe85d4c,0xe8a54b,0x4ecdc4][r]||0x9aa4b5;
}
function mkHuman(opts){
  const g = new THREE.Group();
  const skin = opts.skin || 0xc9a07a;
  const armor = opts.armor || 0x3a4a58;
  const cloth = opts.cloth || 0x5a4030;
  const pants = opts.hasLegs ? armor : cloth;
  const bootsC = opts.hasBoots ? 0x2a1c12 : 0x3a2a20;
  const hips = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), mat(pants, 0.3));
  hips.position.y = 0.62; g.add(hips);
  for(const s of [-1,1]){
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.38, 5, 8), mat(pants, 0.25));
    leg.position.set(s*0.11, 0.32, 0); g.add(leg);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.1, 0.22), mat(bootsC, 0.2));
    boot.position.set(s*0.11, 0.07, 0.04); g.add(boot);
  }
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 0.52, 6, 10), mat(opts.hasChest?armor:cloth, 0.5));
  body.position.y = 1.02; g.add(body);
  for(const s of [-1,1]){
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.38, 5, 8), mat(opts.hasChest?armor:skin, 0.3));
    arm.position.set(s*0.34, 1.02, 0); arm.rotation.z = s*0.25; g.add(arm);
  }
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 14, 14), mat(skin, 0.08));
  head.position.y = 1.52; g.add(head);
  const helm = new THREE.Mesh(new THREE.SphereGeometry(0.23, 12, 12), mat(opts.helm || 0xc9a46a, 0.75));
  helm.scale.set(1.05,0.72,1.1); helm.position.y = 1.62; helm.visible = !!opts.hasHelm; g.add(helm);
  if(opts.hasHelm){
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 0.12), mat(0x111820, 0.4));
    visor.position.set(0, 1.56, 0.16); g.add(visor);
  }
  const cloak = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.85, 10, 1, true), mat(opts.accent || 0x1a4a44, 0.12));
  cloak.position.set(0, 0.95, -0.16); cloak.rotation.x = 0.2; cloak.visible = !!opts.hasChest; g.add(cloak);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.78, 0.06), mat(opts.blade || 0xcfe4f2, 0.9));
  blade.position.set(0.42, 1.12, 0.12); blade.visible = !!opts.hasWeapon; g.add(blade);
  const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.05), mat(0x4a3020, 0.3));
  hilt.position.set(0.42, 0.74, 0.12); hilt.visible = !!opts.hasWeapon; g.add(hilt);
  const shield = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.05, 8), mat(opts.shield || 0x2a6a78, 0.55));
  shield.rotation.z = Math.PI/2; shield.position.set(-0.42, 0.98, 0.08); shield.visible = !!opts.hasShield; g.add(shield);
  if(opts.glow){
    const aura = new THREE.Mesh(new THREE.SphereGeometry(0.75, 12, 12), new THREE.MeshBasicMaterial({color:opts.glow, transparent:true, opacity:0.14}));
    aura.position.y = 1; g.add(aura);
  }
  g.userData.blade = blade;
  return g;
}
function mkBug(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), mat(0x6fbf4a, 0.2));
  body.scale.set(1.2, 0.7, 1.4); g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), mat(0x3d6b28, 0.2));
  head.position.set(0.22, 0.05, 0); g.add(head);
  for(let i=0;i<2;i++){
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.04, 0.16), mat(0xa8e06a, 0.1));
    w.position.set(0, 0.12, i?0.12:-0.12); w.rotation.z = 0.3; g.add(w);
  }
  g.position.y = 0.18; return g;
}
function mkOrc(x){
  const g = mkHuman({
    skin:0x6a8a3a, armor:0x3d4a2a, accent:0x5a3020, helm:0x4a5a30, blade:0x8a9a70, shield:0x3a4a28,
    hasHelm:true, hasChest:true, hasWeapon:true, hasShield:S.zone>0, hasLegs:true, hasBoots:true
  });
  g.position.set(x, 0, 0.4); g.rotation.y = -Math.PI*0.7; return g;
}
function bootThree(){
  const canvas = document.getElementById('c3d');
  if(!canvas || typeof THREE==='undefined') return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const scene = new THREE.Scene();
  const fogCol = S.zone===2?0x12101a:S.zone===1?0x1a1610:0x1a120c;
  scene.fog = new THREE.Fog(fogCol, 5.5, 14);
  const cam = new THREE.PerspectiveCamera(36, w/h, 0.1, 40);
  cam.position.set(0.2, 2.05, 5.6); cam.lookAt(0, 0.95, 0);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(fogCol, 1);
  scene.add(new THREE.HemisphereLight(0xffd9a0, 0x1a2a20, 1.15));
  const sun = new THREE.DirectionalLight(0xffb070, 1.55); sun.position.set(-3, 6, 4); scene.add(sun);
  const fire = new THREE.PointLight(0xff9030, 2.4, 8); fire.position.set(0, 1.1, 0.2); scene.add(fire);

  const gCol = S.zone===2?0x1a1824:S.zone===1?0x2a2618:0x24301c;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 28), mat(gCol, 0.04));
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 7), mat(S.zone===1?0x3a3424:0x4a4030, 0.08));
  path.rotation.x = -Math.PI/2; path.position.y = 0.015; scene.add(path);

  // campfire
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.7,6), mat(0x3a2410,0));
  log.rotation.z = 1.1; log.position.set(0,0.08,0.15); scene.add(log);
  const log2 = log.clone(); log2.rotation.z = -0.9; scene.add(log2);
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.5, 8), new THREE.MeshBasicMaterial({color:0xffaa33}));
  flame.position.set(0, 0.38, 0.15); scene.add(flame);

  // rocks / trees simple
  for(let i=0;i<7;i++){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.7,6), mat(0x3a2414,0));
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.48, 1.55, 8), mat(S.zone===2?0x243044:S.zone===1?0x3a4a28:0x1c3a28, 0.05));
    const x=-4.2+i*1.35, z=-2.2-(i%3)*0.35;
    trunk.position.set(x, 0.35, z); leaf.position.set(x, 1.25, z);
    scene.add(trunk, leaf);
  }
  for(let i=0;i<4;i++){
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18+i*0.04, 0), mat(0x4a463c, 0.1));
    rock.position.set(-1.8+i*1.1, 0.12, 1.3+((i%2)*0.2)); rock.rotation.y=i; scene.add(rock);
  }

  const wr = S.gear.weapon ? S.gear.weapon.r : 0;
  const hero = mkHuman({
    armor: S.gear.chest ? 0x3a4a58 : 0x6a4a38,
    accent: S.gear.chest ? rarityHex(S.gear.chest.r) : 0x3a2a20,
    helm: S.gear.helm ? rarityHex(S.gear.helm.r) : 0xc9a07a,
    blade: S.gear.weapon ? rarityHex(wr) : 0xb8d4e8,
    shield: S.gear.shield ? rarityHex(S.gear.shield.r) : 0x2a6a78,
    hasHelm: !!S.gear.helm,
    hasChest: !!S.gear.chest,
    hasWeapon: !!S.gear.weapon,
    hasShield: !!S.gear.shield,
    hasLegs: !!S.gear.legs,
    hasBoots: !!S.gear.boots,
    glow: S.gear.weapon && wr>=3 ? rarityHex(wr) : null
  });
  hero.position.set(-1.6, 0, 0.5); hero.rotation.y = Math.PI*0.55; scene.add(hero);
  const pet = mkBug(); pet.visible = !!S.pet; pet.position.set(-2.15, 0.18, 0.9); scene.add(pet);
  const orcA = mkOrc(1.7); const orcB = mkOrc(2.35); orcB.position.z = 0.95; scene.add(orcA, orcB);

  three = {ready:true, scene, cam, renderer, hero, pet, orcs:[orcA,orcB], flame, fire, t:0};
  loop();
}
function loop(){
  if(!three.ready) return;
  three.t += 0.016;
  const t = three.t;
  three.flame.scale.y = 1 + Math.sin(t*8)*0.15;
  three.fire.intensity = 2 + Math.sin(t*6)*0.4;
  if(S.fighting){
    three.hero.position.x = -1.35 + Math.sin(t*10)*0.06;
    three.hero.userData.blade.rotation.z = Math.sin(t*12)*0.6;
    three.orcs.forEach((o,i)=> o.position.x = 1.7+i*0.6 + Math.sin(t*9+i)*0.05);
    three.pet.rotation.y = t*3;
  } else {
    three.hero.position.y = Math.sin(t*2)*0.02;
  }
  three.renderer.render(three.scene, three.cam);
  three.raf = requestAnimationFrame(loop);
}

function startFight(){
  if(S.energy<2){ toast('Vigore insufficiente'); return; }
  const Z = ZONES[S.zone];
  S.energy -= 2; S.fighting = true; S.hp = 100; S.ehp = Z.hp;
  renderHuntChrome();
  let n = 0;
  const id = setInterval(()=>{
    if(!S.fighting){ clearInterval(id); return; }
    n++;
    const watk = (S.gear.weapon && S.gear.weapon.atk) || 0;
    const def = Object.values(S.gear).reduce((a,g)=>g?a+g.def+g.plus*2:a,0);
    const dmg = 28 + Math.floor(Math.random()*18) + watk + S.lv*3;
    const taken = Math.max(4, Z.hit + Math.floor(Math.random()*6) - Math.floor(def/6));
    S.ehp = Math.max(0, S.ehp - (20 + Math.floor(dmg/10)));
    S.hp = Math.max(0, S.hp - taken);
    floatDmg(dmg, false); floatDmg(taken, true);
    renderHuntChrome();
    if(S.ehp<=0){
      S.fighting=false; clearInterval(id);
      S.xp += Z.xp + S.lv*4; S.crowns += 2 + S.zone; S.wins++;
      if(S.xp>=S.xpMax){
        S.xp-=S.xpMax; S.lv++; S.xpMax=Math.round(S.xpMax*1.25);
        S.energyMax = 20 + S.lv*2; S.energy = S.energyMax;
        if(S.lv===4 && !S.pet){ S.pet={name:'Scarabeo di Muschio', lv:1}; toast('Uovo schiuso · Scarabeo di Muschio'); }
        else toast('Livello '+S.lv);
      }
      const drop = rollDrop();
      toast(drop ? ('Vittoria · '+drop.name) : 'Vittoria');
      render(); requestAnimationFrame(bootThree);
      if(S.auto) setTimeout(()=>{ if(S.auto && !S.fighting) startFight(); }, 900);
    } else if(S.hp<=0){
      S.fighting=false; clearInterval(id);
      toast('Sconfitta · ricalibra la build');
      render(); requestAnimationFrame(bootThree);
      if(S.auto) setTimeout(()=>{ if(S.auto && !S.fighting) startFight(); }, 1400);
    }
  }, 700);
}

function floatDmg(n, onHero){
  const stage = document.getElementById('stage'); if(!stage) return;
  const el = document.createElement('div');
  el.className = 'float';
  el.style.color = onHero ? '#e85d4c' : '#ffe28a';
  el.style.left = (onHero? 18 : 62) + Math.random()*10 + '%';
  el.style.top = (38 + Math.random()*10) + '%';
  el.textContent = n;
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 700);
}
function rollDrop(){
  const keys = Object.keys(SLOTS);
  const empty = keys.filter(k=>!S.gear[k]);
  const force = empty.length>0 && Math.random()<0.72;
  if(!force && Math.random()>0.42) return null;
  const key = empty.length ? empty[Math.floor(Math.random()*empty.length)] : keys[Math.floor(Math.random()*keys.length)];
  const bonus = ZONES[S.zone].drop;
  const r = Math.min(7, (S.lv<3 ? 0 : Math.random()<0.06 ? 3 : Math.random()<0.22 ? 2 : Math.random()<0.55 ? 1 : 0) + bonus);
  const names = NAMES[S.zone][key];
  const ilvl = Math.max(1, S.lv + S.zone*2 + Math.floor(Math.random()*4) + r);
  const item = {
    slot: SLOTS[key].slot,
    svg: SLOTS[key].svg,
    name: names[Math.min(r, names.length-1)],
    r, ilvl, plus:0,
    atk: Math.round(((key==='weapon'||key==='ring'||key==='amulet') ? 6 : 2) + ilvl*(1+r*0.35) + r*4),
    def: key==='weapon' ? 0 : Math.round(4 + ilvl*(0.8+r*0.3) + r*3)
  };
  const cur = S.gear[key];
  item.key = key;
  if(!cur){
    S.gear[key]=item;
    S.dust += 2+r;
    return item;
  }
  S.bag.push(item);
  S.dust += 1+r;
  return {name: item.name+' (borsa)'};
}

function renderHuntChrome(){
  const ally = document.getElementById('hpA');
  const foe = document.getElementById('hpB');
  const en = document.getElementById('enVal');
  if(ally) ally.style.width = S.hp+'%';
  if(foe) foe.style.width = S.ehp+'%';
  if(en) en.textContent = S.energy;
  const bars = document.getElementById('bars');
  if(bars) bars.style.display = S.fighting ? 'flex' : 'none';
}

function huntView(){
  const pct = Math.round(S.xp/S.xpMax*100);
  return `
    <div id="stage">
      <canvas id="c3d"></canvas>
      <div class="hud">
        <div class="pill" style="top:8px;left:8px">★ LVL ${S.lv} · ${S.xp} / ${S.xpMax} XP
          <div style="height:4px;background:#1a2238;border-radius:9px;margin-top:4px;width:120px"><div style="height:100%;width:${pct}%;background:var(--teal);border-radius:9px"></div></div>
        </div>
        <div class="pill" style="top:8px;right:8px">⚡ <b id="enVal">${S.energy}</b> +1/35s</div>
        <div class="fabcol">
          <div class="fab" onclick="toast('Ricompense')">🎁</div>
          <div class="fab" onclick="S.fighting=false;toast('Pausa')">⏸</div>
        </div>
        <div class="hp-wrap" id="bars" style="display:${S.fighting?'flex':'none'}">
          <div class="hp ally"><i id="hpA" style="width:${S.hp}%"></i></div>
          <div class="hp foe"><i id="hpB" style="width:${S.ehp}%"></i></div>
        </div>
      </div>
    </div>
    <div class="mini" style="margin-bottom:8px">
      <button class="btn btn-c" onclick="startFight()">⚔ ATTACCA</button>
      <button class="btn btn-g" onclick="S.auto=!S.auto;toast(S.auto?'Auto-caccia ON':'Auto OFF');if(S.auto&&!S.fighting)startFight()">AUTO ${S.auto?'ON':'OFF'}</button>
    </div>
    <div class="card" style="margin-bottom:8px;font-size:13px" onclick="go('world')">
      <span class="kicker">Zona</span> <b>${ZONES[S.zone].n}</b>
    </div>
    <div class="card" style="margin-bottom:8px;display:flex;justify-content:space-between">
      <div><div class="kicker">Costo</div><b>⚡ −2 / caccia</b></div>
      <div style="text-align:center"><div class="kicker">Polvere</div><b style="color:var(--copper)">${S.dust}</b></div>
      <div style="text-align:right"><div class="kicker">Drop</div><span style="color:#6aa6ff">20%</span> <span style="color:#6fbf73">31%</span> <span style="color:#8b93a7">49%</span></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span class="kicker">Equipaggiamento</span><b style="color:var(--copper)">${power()} POTENZA</b>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
        ${['helm','shoulder','chest','legs','boots','weapon','shield','ring','amulet'].map(k=>{
          const g=S.gear[k];
          if(!g) return `<div class="empty" onclick="go('char','gear');openItem('${k}')" style="text-align:center">
            <div class="glyph" style="width:100%;height:56px">${svgIco(SLOTS[k].svg,'#4a5568')}</div>
          </div>`;
          return `<div class="r${g.r}" onclick="go('char','gear');openItem('${k}')" style="text-align:center">
            <div class="glyph" style="width:100%;height:56px">${svgIco(g.svg,RAR[g.r].col)}<b>${g.ilvl}</b></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function charView(){
  return `
    <div class="seg">
      <button class="${S.sub==='gear'?'on':''}" onclick="go('char','gear')">EROE<small>SAGOMA · GEAR</small></button>
      <button class="${S.sub==='pets'?'on':''}" onclick="go('char','pets')">COMPAGNI<small>PET · CAVALCATURE</small></button>
      <button class="${S.sub==='art'?'on':''}" onclick="go('char','art')">ARTEFATTI<small>SIGILLI</small></button>
    </div>
    ${S.sub==='gear'?dollView():S.sub==='pets'?petsView():`<div class="card" style="text-align:center;padding:48px;color:var(--muted)">Sigilli · livello 25</div>`}
  `;
}

function piece(key, style){
  const g = S.gear[key];
  if(!g) return `<div class="piece empty" style="${style}" onclick="openItem('${key}')">
    <div class="glyph">${svgIco(SLOTS[key].svg,'#4a5568')}</div>
  </div>`;
  return `<div class="piece r${g.r}" style="${style}" onclick="openItem('${key}')">
    <div class="glyph">${svgIco(g.svg,RAR[g.r].col)}<b>${g.ilvl}</b></div>
  </div>`;
}

function dollView(){
  return `
    <div class="card" style="text-align:center">
      <div class="kicker">Armeria · sagoma</div>
      <div style="font-family:Cinzel,serif;font-size:18px;margin-top:4px">${S.name} · ${power()} pot.</div>
      <div class="doll">
        ${piece('helm','left:50%;top:0;transform:translateX(-50%)')}
        ${piece('shoulder','left:50%;top:78px;transform:translateX(-50%)')}
        ${piece('weapon','left:8px;top:150px')}
        ${piece('chest','left:50%;top:156px;transform:translateX(-50%)')}
        ${piece('shield','right:8px;top:150px')}
        ${piece('ring','left:8px;top:230px')}
        ${piece('legs','left:50%;top:234px;transform:translateX(-50%)')}
        ${piece('amulet','right:8px;top:230px')}
        ${piece('boots','left:50%;top:312px;transform:translateX(-50%)')}
      </div>
    </div>
    <div class="row">
      <div style="width:40px;height:40px;border-radius:10px;background:#0e1628;border:1px dashed #2a3550;display:grid;place-items:center">${S.pet?'🪲':''}</div>
      <div><b>${S.pet?S.pet.name:'Nessun compagno'}</b><div class="kicker">${S.pet?('PET · LVL '+S.pet.lv):'Uovo a livello 4'}</div></div>
      <button class="btn btn-g" style="margin-left:auto" onclick="toast(S.pet?'Un solo pet per ora':'Ancora niente')">SWAP</button>
    </div>
    <div class="card" style="font-size:12px;color:var(--muted);line-height:1.45">
      Il bagliore è la rarità. Tocca un pezzo per il +1 fino a +10.
      Polvere: <b style="color:var(--copper)">${S.dust}</b> · borsa: <b>${S.bag.length}</b>
    </div>
    ${S.bag.length?`<div class="kicker" style="margin:10px 0 6px">Borsa</div>`+S.bag.map((it,i)=>`
      <div class="row" onclick="equipBag(${i})">
        <div class="r${it.r}"><div class="glyph" style="width:44px;height:44px">${svgIco(it.svg,RAR[it.r].col)}</div></div>
        <div><b>${it.name}</b><div class="kicker">${it.slot} · ${RAR[it.r].n} · ilvl ${it.ilvl}</div></div>
      </div>`).join(''):''}`;
}

function petsView(){
  if(!S.pet) return `<div class="card" style="text-align:center;padding:36px;color:var(--muted)">Primo uovo a livello 4<br><span class="kicker">ora LVL ${S.lv}</span></div>`;
  return `<div class="card">
    <div class="kicker">Compagno attivo</div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:8px">
      <div class="r2"><div class="glyph">🪲</div></div>
      <div><b>${S.pet.name}</b><div class="kicker">Runico · LVL ${S.pet.lv}</div></div>
    </div>
  </div>`;
}
function equipBag(i){
  const it=S.bag[i]; if(!it) return;
  const old=S.gear[it.key];
  S.gear[it.key]=it;
  S.bag.splice(i,1);
  if(old) S.bag.push(old);
  toast('Equipaggiato · '+it.name);
  render();
}

function setZone(i){
  const z=ZONES[i];
  if(S.lv < z.need){ toast('Serve livello '+z.need); return; }
  S.zone=i; toast(z.n); render(); if(S.tab==='hunt') requestAnimationFrame(bootThree);
}
function worldView(){
  return `<div class="kicker" style="margin-bottom:10px">Reame · zone di caccia</div>
    ${ZONES.map(z=>{
      const ok = S.lv>=z.need;
      const on = S.zone===z.id;
      return `<div class="row ${ok?'':'locked'}" onclick="setZone(${z.id})">
        <div><b>${on?'▸ ':''}${z.n}</b><div class="kicker">${ok?('HP mostri '+z.hp+' · drop +'+z.drop):('Sblocco LVL '+z.need)}</div></div>
        <span class="kicker">${on?'IN USO':''}</span>
      </div>`;
    }).join('')}`;
}
function clashView(){
  return `<div class="kicker" style="margin-bottom:10px">Lizza · sblocchi da lvl 18</div>
    ${['Compagnia','Arena','Guerre di Compagnia','Fortezza','Lizza di Conquista'].map(t=>`<div class="row locked"><b>${t}</b></div>`).join('')}`;
}

function openItem(key){
  const g=S.gear[key];
  if(!g){
    const sheet=document.getElementById('sheet');
    sheet.className='sheet on';
    sheet.innerHTML = `<div class="panel">
      <div class="kicker">${SLOTS[key].slot} · vuoto</div>
      <p style="color:var(--muted);font-size:14px">Niente di equipaggiato. Caccia: i primi drop riempiono gli slot vuoti.</p>
      <button class="btn btn-g" style="width:100%" onclick="closeSheet()">Chiudi</button>
    </div>`;
    return;
  }
  const r=RAR[g.r];
  const cost = 20 + g.plus*15;
  const sheet=document.getElementById('sheet');
  sheet.className='sheet on';
  sheet.innerHTML = `<div class="panel">
    <div class="kicker">${g.slot} · ${r.n}</div>
    <div style="display:flex;gap:12px;align-items:center;margin:10px 0">
      <div class="r${g.r}"><div class="glyph">${svgIco(g.svg,r.col)}</div></div>
      <div>
        <b style="font-size:18px">${g.name}</b>
        <div class="stars">${'★'.repeat(Math.min(5,g.r+1))}</div>
        <div class="kicker">ILVL ${g.ilvl} · +${g.plus}/10</div>
      </div>
    </div>
    <div class="mini" style="margin:10px 0">
      <div class="card"><div class="kicker">Attacco</div><b>${g.atk + g.plus*3}</b></div>
      <div class="card"><div class="kicker">Difesa</div><b>${g.def + g.plus*2}</b></div>
    </div>
    <div class="card" style="margin-bottom:10px;font-size:12px;color:var(--muted)">
      Ogni +1 aumenta attacco e difesa. A +4 / +7 / +10 il pezzo cambia silhouette e intensità del bagliore.
      Rarità più alta = mesh più lavorata in 3D (creste, rune, particelle).
    </div>
    <div class="mini">
      <button class="btn btn-c" onclick="upgrade('${key}',${cost})">+1 · ${cost} polvere (hai ${S.dust})</button>
      <button class="btn btn-g" onclick="reroll('${key}')">RICALIBRA AFFISSI</button>
    </div>
    <button class="btn btn-g" style="width:100%;margin-top:8px" onclick="closeSheet()">Chiudi</button>
  </div>`;
}
function closeSheet(){document.getElementById('sheet').className='sheet'}
function upgrade(key, cost){
  const g=S.gear[key];
  if(g.plus>=10){toast('Già +10');return}
  if(S.dust<cost){toast('Polvere insufficiente');return}
  S.dust-=cost; g.plus++;
  if(g.plus===4||g.plus===7||g.plus===10) toast(g.name+' cambia forma');
  else toast(g.name+' +'+g.plus);
  openItem(key); if(S.tab==='char') render();
}
function reroll(key){
  const g=S.gear[key];
  g.atk = Math.max(0, g.atk + Math.floor(Math.random()*7-3));
  g.def = Math.max(0, g.def + Math.floor(Math.random()*7-3));
  toast('Affissi ricalibrati'); openItem(key);
}

function render(){
  const map={hunt:huntView,char:charView,world:worldView,clash:clashView};
  document.getElementById('view').innerHTML = map[S.tab]();
}
render();
requestAnimationFrame(bootThree);
setInterval(()=>{
  if(S.energy<S.energyMax){ S.energy++; const en=document.getElementById('enVal'); if(en) en.textContent=S.energy; }
  if(S.auto && !S.fighting && S.tab==='hunt' && S.energy>=2) startFight();
}, 3500);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
