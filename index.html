  <style>
    :root {
      --bg:#140e10; --bg2:#1a1216; --card:#241820; --line:#4a3038; --soft:#3a242c;
      --text:#f4ebe4; --muted:#b09898; --copper:#d45c5c; --teal:#e8c9a0; --rose:#c43c48;
      --nav: calc(64px + env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
    #app{height:100%;max-width:430px;margin:0 auto;position:relative;background:var(--bg2);display:flex;flex-direction:column}
    .screen{flex:1;overflow-y:auto;padding:12px 12px calc(var(--nav) + 10px);scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}
    .nav{position:absolute;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);
      background:#120c10;border-top:1px solid var(--soft);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
    .nav button{background:0;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;letter-spacing:.12em;font-weight:600}
    .nav button.on{color:#e8c9a0}
    .nav svg{width:22px;height:22px}
    .card,.row,.seg button{background:var(--card);border:1px solid var(--line);border-radius:16px}
    .card{padding:14px}
    .row{padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
    .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
    .seg button{padding:11px 6px;color:var(--muted);font-size:11px;font-weight:600}
    .seg button small{display:block;font-weight:400;opacity:.7;margin-top:2px;font-size:9px;letter-spacing:.08em}
    .seg button.on{background:#2a1818;border-color:#d45c5c;color:#e8c9a0}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:13px}
    .btn-c{background:#d45c5c;color:#fff8f4}
    .btn-g{background:#161e32;color:var(--text);border:1px solid var(--line)}
    .locked{opacity:.45}
    .kicker{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
    .toast{position:absolute;left:16px;right:16px;bottom:calc(var(--nav)+10px);background:#2a1418;border:1px solid #d45c5c;color:#e8c9a0;padding:10px;border-radius:12px;font-size:12px;text-align:center;display:none;z-index:30}

    /* 3D stage */
    #stage{position:relative;height:268px;border-radius:8px 8px 18px 18px;overflow:hidden;border:1px solid var(--line);background:#1a1014;margin-bottom:10px}
    #c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hud{position:absolute;inset:0;pointer-events:none;z-index:2}
    .hud > *{pointer-events:auto}
    .hp-wrap{position:absolute;left:12px;right:12px;bottom:10px;display:flex;gap:8px;align-items:center}
    .hp{flex:1;height:8px;background:#1a1020;border-radius:99px;overflow:hidden;border:1px solid #2a2030}
    .hp > i{display:block;height:100%;width:100%;transition:width .25s}
    .hp.ally i{background:linear-gradient(90deg,#4ecdc4,#6fbf73)}
    .hp.foe i{background:linear-gradient(90deg,#e85d4c,#c23b4a)}
    .float{position:absolute;font-weight:800;font-size:15px;text-shadow:0 2px 6px #000;animation:up 700ms ease-out forwards;pointer-events:none}
    @keyframes up{to{transform:translateY(-46px);opacity:0}}
    .pill{position:absolute;background:rgba(7,11,22,.82);border:1px solid var(--line);border-radius:12px;padding:6px 9px;font-size:11px;backdrop-filter:blur(8px)}
    .fabcol{position:absolute;right:8px;top:48px;display:flex;flex-direction:column;gap:6px}
    .fab{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(7,11,22,.8);color:#fff;display:grid;place-items:center}

    /* paper doll */
    .doll{position:relative;height:390px;margin:6px 0 10px}
    .piece{position:absolute;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
    .glyph{width:68px;height:68px;border-radius:16px;display:grid;place-items:center;font-size:28px;
      background:#0e1628;border:1px solid #2a3550;position:relative}
    .glyph b{position:absolute;right:-6px;bottom:-6px;min-width:22px;height:20px;padding:0 5px;border-radius:8px;
      background:#121a2e;border:1px solid #2a3550;font-size:11px;display:grid;place-items:center}
    .r0 .glyph{border-color:#4a5568}
    .r1 .glyph{border-color:#9aa4b5;box-shadow:0 0 12px #9aa4b544}
    .r2 .glyph{border-color:#6fbf73;box-shadow:0 0 16px #6fbf7366}
    .r3 .glyph{border-color:#5ad0ff;box-shadow:0 0 18px #3db7ff88}
    .r4 .glyph{border-color:#b48cff;box-shadow:0 0 20px #8b7cff88}
    .r5 .glyph{border-color:#e85d4c;box-shadow:0 0 20px #e85d4c77}
    .r6 .glyph{border-color:#e8a54b;box-shadow:0 0 22px #e8a54b99}
    .r7 .glyph{border-color:#4ecdc4;box-shadow:0 0 24px #e8a54bcc,0 0 36px #4ecdc466}
    .empty .glyph{border-style:dashed;border-color:#2a3550;background:#0a101c;box-shadow:none;opacity:.7}
    .ico{width:28px;height:28px;display:block}
    .sheet{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
    .sheet.on{display:flex}
    .sheet .panel{width:100%;max-width:430px;background:#10182c;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
    .stars{letter-spacing:2px;color:var(--copper)}
    .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  </style>
</head>

function bootThree(){
  const canvas = document.getElementById('c3d');
  if(!canvas || typeof THREE==='undefined') return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const scene = new THREE.Scene();
  const fogCol = S.zone===2?0x12101a:S.zone===1?0x1a1610:0x1a120c;
  scene.fog = new THREE.Fog(fogCol, 5.5, 14);
  const cam = new THREE.PerspectiveCamera(36, w/h, 0.1, 40);
  cam.position.set(0.2, 2.05, 5.6); cam.lookAt(0, 0.95, 0);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(fogCol, 1);
  scene.add(new THREE.HemisphereLight(0xffd9a0, 0x1a2a20, 1.15));
  const sun = new THREE.DirectionalLight(0xffb070, 1.55); sun.position.set(-3, 6, 4); scene.add(sun);
  const fire = new THREE.PointLight(0xff9030, 2.4, 8); fire.position.set(0, 1.1, 0.2); scene.add(fire);

  const gCol = S.zone===2?0x1a1824:S.zone===1?0x2a2618:0x24301c;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 28), mat(gCol, 0.04));
  ground.rotation.x = -Math.PI/2; scene.add(ground);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 7), mat(S.zone===1?0x3a3424:0x4a4030, 0.08));
  path.rotation.x = -Math.PI/2; path.position.y = 0.015; scene.add(path);

  // campfire
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.7,6), mat(0x3a2410,0));
  log.rotation.z = 1.1; log.position.set(0,0.08,0.15); scene.add(log);
  const log2 = log.clone(); log2.rotation.z = -0.9; scene.add(log2);
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.5, 8), new THREE.MeshBasicMaterial({color:0xffaa33}));
  flame.position.set(0, 0.38, 0.15); scene.add(flame);

  // rocks / trees simple
  for(let i=0;i<7;i++){
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.12,0.7,6), mat(0x3a2414,0));
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.48, 1.55, 8), mat(S.zone===2?0x243044:S.zone===1?0x3a4a28:0x1c3a28, 0.05));
    const x=-4.2+i*1.35, z=-2.2-(i%3)*0.35;
    trunk.position.set(x, 0.35, z); leaf.position.set(x, 1.25, z);
    scene.add(trunk, leaf);
  }
  for(let i=0;i<4;i++){
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18+i*0.04, 0), mat(0x4a463c, 0.1));
    rock.position.set(-1.8+i*1.1, 0.12, 1.3+((i%2)*0.2)); rock.rotation.y=i; scene.add(rock);
  }

  const pet = mkBug(); pet.visible = !!S.pet; pet.position.set(-2.15, 0.18, 0.9); scene.add(pet);
  const orcA = mkOrc(1.7); const orcB = mkOrc(2.35); orcB.position.z = 0.95; scene.add(orcA, orcB);

  three = {ready:true, scene, cam, renderer, hero:null, pet, orcs:[orcA,orcB], flame, fire, t:0, mixer:null};
  function placeHero(obj){
    obj.scale.setScalar(1.15);
    obj.position.set(-1.55, 0, 0.45);
    obj.rotation.y = Math.PI*0.55;
    scene.add(obj);
    three.hero = obj;
  }
  const load = window._gltfLoader;
  if(load){
    load.load('hero.glb', (g)=>{
      if(g.animations && g.animations.length){
        three.mixer = new THREE.AnimationMixer(g.scene);
        const clip = g.animations.find(a=>/idle|Idle|wait/i.test(a.name)) || g.animations[0];
        three.mixer.clipAction(clip).play();
        three.clips = g.animations;
      }
      placeHero(g.scene);
    }, undefined, ()=>{ placeHero(mkHuman({hasHelm:!!S.gear.helm,hasChest:!!S.gear.chest,hasWeapon:!!S.gear.weapon,hasShield:!!S.gear.shield,hasLegs:!!S.gear.legs,hasBoots:!!S.gear.boots})); });
  } else {
    placeHero(mkHuman({hasHelm:!!S.gear.helm,hasChest:!!S.gear.chest,hasWeapon:!!S.gear.weapon,hasShield:!!S.gear.shield,hasLegs:!!S.gear.legs,hasBoots:!!S.gear.boots}));
  }
  loop();
}
function loop(){
  if(!three.ready) return;
  three.t += 0.016;
  const t = three.t;
  three.flame.scale.y = 1 + Math.sin(t*8)*0.15;
  three.fire.intensity = 2 + Math.sin(t*6)*0.4;
  if(three.mixer) three.mixer.update(0.016);
  if(three.hero){
    if(S.fighting){
      three.hero.position.x = -1.35 + Math.sin(t*10)*0.04;
      if(three.hero.userData && three.hero.userData.blade) three.hero.userData.blade.rotation.z = Math.sin(t*12)*0.6;
    } else {
      three.hero.position.y = Math.sin(t*2)*0.015;
    }
  }
  three.orcs.forEach((o,i)=> { if(S.fighting) o.position.x = 1.7+i*0.6 + Math.sin(t*9+i)*0.05; });
  if(three.pet) three.pet.rotation.y = t*3;

  three.renderer.render(three.scene, three.cam);
  three.raf = requestAnimationFrame(loop);
}

function startFight(){
  if(S.energy<2){ toast('Vigore insufficiente'); return; }
  themePlay();
  const Z = ZONES[S.zone];
  const boss = ((S.q.kills+1)%10===0);
  S.boss = boss;
  S.energy -= boss?4:2; S.fighting = true; S.hp = 100; S.ehp = boss? Math.round(Z.hp*2.2): Z.hp;
  if(boss) toast('BOSS · '+Z.boss);
  renderHuntChrome();
  let n = 0;
  const id = setInterval(()=>{
    if(!S.fighting){ clearInterval(id); return; }
    n++;
    slashSnd();
    const watk = (S.gear.weapon && S.gear.weapon.atk) || 0;
    const def = Object.values(S.gear).reduce((a,g)=>g?a+g.def+g.plus*2:a,0);
    const dmg = 28 + Math.floor(Math.random()*18) + watk + S.lv*3;
    const taken = Math.max(4, (boss?Z.hit+8:Z.hit) + Math.floor(Math.random()*6) - Math.floor(def/6));
    S.ehp = Math.max(0, S.ehp - (20 + Math.floor(dmg/10)));
    S.hp = Math.max(0, S.hp - taken);
    floatDmg(dmg, false); floatDmg(taken, true);
    renderHuntChrome();
    if(S.ehp<=0){
      S.fighting=false; clearInterval(id);
      S.q.kills++; if(boss) S.q.bosses++; S.pass=(S.pass||0)+(boss?15:5);
      if(S.q.kills===40){ S.dust+=80; toast("Quest · 40 prede · +80 polvere"); }
      if(S.q.bosses===5){ S.dust+=120; toast("Quest · 5 boss · +120 polvere"); }
      S.xp += (boss?Z.xp*2:Z.xp) + S.lv; S.crowns += (boss?12:2) + S.zone; S.wins++;
      if(S.xp>=S.xpMax){
        S.xp-=S.xpMax; S.lv++; S.xpMax=Math.round(S.xpMax*1.45);
        S.energyMax = 36 + S.lv*2; S.energy = S.energyMax;
        if(S.lv===4 && !S.pet){ S.pet={name:'Scarabeo di Muschio', lv:1}; toast('Uovo schiuso · Scarabeo di Muschio'); }
        else toast('Livello '+S.lv);
      }
      const drop = rollDrop();
      toast(drop ? ('Vittoria · '+drop.name) : 'Vittoria');
      persist(); render(); requestAnimationFrame(bootThree);
      if(S.auto) setTimeout(()=>{ if(S.auto && !S.fighting) startFight(); }, 900);
    } else if(S.hp<=0){
      S.fighting=false; clearInterval(id);
      toast('Sconfitta · ricalibra la build');
      persist(); render(); requestAnimationFrame(bootThree);
      if(S.auto) setTimeout(()=>{ if(S.auto && !S.fighting) startFight(); }, 1400);
    }
  }, 700);
}

function floatDmg(n, onHero){
  const stage = document.getElementById('stage'); if(!stage) return;
  const el = document.createElement('div');
  el.className = 'float';
  el.style.color = onHero ? '#e85d4c' : '#ffe28a';
  el.style.left = (onHero? 18 : 62) + Math.random()*10 + '%';
  el.style.top = (38 + Math.random()*10) + '%';
  el.textContent = n;
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 700);
}
function rollDrop(){
  const keys = Object.keys(SLOTS);
  const empty = keys.filter(k=>!S.gear[k]);
  const force = empty.length>0 && Math.random()<0.72;
  if(!force && Math.random()>0.42) return null;
  const key = empty.length ? empty[Math.floor(Math.random()*empty.length)] : keys[Math.floor(Math.random()*keys.length)];
  const bonus = ZONES[S.zone].drop;
  const r = Math.min(3, (S.lv<4 ? 0 : Math.random()<0.08 ? 3 : Math.random()<0.22 ? 2 : Math.random()<0.50 ? 1 : 0) + Math.min(2,Math.floor(bonus/2)));
  const zid = Math.min(S.zone, 5);
  let names = (NAMES[zid]&&NAMES[zid][key]) ? NAMES[zid][key] : NAMES[0][key];
  let svg = SLOTS[key].svg;
  if(key==='weapon'){
    const w = WEPS[Math.floor(Math.random()*WEPS.length)];
    svg = w.svg;
    names = w.names;
  }
  const ilvl = Math.max(1, S.lv + S.zone*2 + Math.floor(Math.random()*4) + r);
  const item = {
    slot: SLOTS[key].slot,
    svg,
    name: names[Math.min(Math.min(r, names.length-1), names.length-1)],
    r, ilvl, plus:0,
    atk: Math.round(((key==='weapon'||key==='ring'||key==='amulet') ? 8 : 3) + ilvl*(1+r*0.55) + r*r*6),
    def: key==='weapon' ? 0 : Math.round(5 + ilvl*(0.9+r*0.45) + r*r*5)
  };
  const cur = S.gear[key];
  item.key = key;
  if(!cur){
    S.gear[key]=item;
    S.dust += 2+r;
    return item;
  }
  S.bag.push(item);
  S.dust += 1+r;
  return {name: item.name+' (borsa)'};
}

function equipBag(i){
  const it=S.bag[i]; if(!it) return;
  const old=S.gear[it.key];
  S.gear[it.key]=it;
  S.bag.splice(i,1);
  if(old) S.bag.push(old);
  toast('Equipaggiato · '+it.name);
  render();
}

function setZone(i){
  const z=ZONES[i];
  if(S.lv < z.need){ toast('Serve livello '+z.need); return; }
  S.zone=i; toast(z.n); render(); if(S.tab==='hunt') requestAnimationFrame(bootThree);
}
function worldView(){
  const qdone = S.q.kills>=40;
  return `<div class="kicker" style="margin-bottom:10px">Reame · zone e quest</div>
    <div class="card" style="margin-bottom:10px">
      <div class="kicker">Quest attiva</div>
      <b>Caccia 40 bestie</b>
      <div class="kicker" style="margin-top:4px">${S.q.kills}/40 · ${qdone?'COMPLETATA · +80 polvere già presa':''}</div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div class="kicker">Quest boss</div>
      <b>Abbatti 5 boss</b>
      <div class="kicker" style="margin-top:4px">${S.q.bosses}/5</div>
    </div>
    ${ZONES.map(z=>{
      const ok = S.lv>=z.need;
      const on = S.zone===z.id;
      return `<div class="row ${ok?'':'locked'}" onclick="setZone(${z.id})">
        <div><b>${on?'▸ ':''}${z.n}</b><div class="kicker">${ok?('HP mostri '+z.hp+' · drop +'+z.drop):('Sblocco LVL '+z.need)}</div></div>
        <span class="kicker">${on?'IN USO':''}</span>
      </div>`;
    }).join('')}`;
}
function today(){ return new Date().toISOString().slice(0,10); }
function orderView(){
  const raidOk = S.raid !== today();
  const forgeLeft = Math.max(0, S.forge - Date.now());
  return `<div class="kicker" style="margin-bottom:10px">Ordine · attività lunghe</div>
    <div class="card" style="margin-bottom:8px">
      <div class="kicker">Pass stagione</div>
      <b>Gradino ${1+Math.floor((S.pass||0)/100)}</b>
      <div class="kicker" style="margin-top:4px">${(S.pass||0)%100}/100 · si riempie cacciando</div>
    </div>
    <div class="card" style="margin-bottom:8px">
      <div class="kicker">Forgia</div>
      <b>${forgeLeft?('In corso · '+Math.ceil(forgeLeft/1000)+'s'):'Pronta'}</b>
      <div class="kicker" style="margin-top:4px">40 polvere · arma Rara garantita</div>
      <button class="btn btn-c" style="margin-top:10px;width:100%" onclick="startForge()">FORGIA</button>
    </div>
    <div class="card" style="margin-bottom:8px">
      <div class="kicker">Incursione del giorno</div>
      <b>${raidOk?'Aperta · boss unico':'Già abbattuto oggi'}</b>
      <button class="btn ${raidOk?'btn-c':'btn-g'}" style="margin-top:10px;width:100%" onclick="doRaid()">${raidOk?'AFFRONTA':'CHIUSO'}</button>
    </div>
    <div class="card">
      <div class="kicker">Compagnia</div>
      <b>Caccia 40 prede</b>
      <div class="kicker" style="margin-top:4px">${S.q.kills}/40 · ricompensa polvere</div>
    </div>`;
}
function startForge(){
  if(S.forge && S.forge>Date.now()){ toast('Forgia occupata'); return; }
  if(S.forge && S.forge<=Date.now()){
    S.forge=0;
    const item={slot:'Arma',svg:'sword',key:'weapon',name:'Lama di Forgia',r:1,ilvl:Math.max(4,S.lv+2),plus:0,atk:18+S.lv*3,def:0};
    const old=S.gear.weapon; S.gear.weapon=item; if(old) S.bag.push(old);
    S.dust+=4; persist(); toast('Forgiata · Lama di Forgia'); render(); return;
  }
  if(S.dust<40){ toast('Servono 40 polvere'); return; }
  S.dust-=40; S.forge=Date.now()+20000; persist(); toast('In forgia · 20s'); render();
}
function doRaid(){
  if(S.raid===today()){ toast('Torna domani'); return; }
  if(S.lv<3){ toast('Serve livello 3'); return; }
  S.raid=today(); S.dust+=25; S.crowns+=20; S.xp+=40; S.pass=(S.pass||0)+30;
  if(S.xp>=S.xpMax){ S.xp-=S.xpMax; S.lv++; S.xpMax=Math.round(S.xpMax*1.45); }
  persist(); toast('Incursione vinta · +25 polvere'); render();
}

function openItem(key){
  const g=S.gear[key];
  if(!g){
    const sheet=document.getElementById('sheet');
    sheet.className='sheet on';
    sheet.innerHTML = `<div class="panel">
      <div class="kicker">${SLOTS[key].slot} · vuoto</div>
      <p style="color:var(--muted);font-size:14px">Niente di equipaggiato. Caccia: i primi drop riempiono gli slot vuoti.</p>
      <button class="btn btn-g" style="width:100%" onclick="closeSheet()">Chiudi</button>
    </div>`;
    return;
  }
  const r=RAR[g.r];
  const cost = 20 + g.plus*15;
  const sheet=document.getElementById('sheet');
  sheet.className='sheet on';
  sheet.innerHTML = `<div class="panel">
    <div class="kicker">${g.slot} · ${r.n}</div>
    <div style="display:flex;gap:12px;align-items:center;margin:10px 0">
      <div class="r${g.r}"><div class="glyph">${svgIco(g.svg,r.col,g.r)}</div></div>
      <div>
        <b style="font-size:18px">${g.name}</b>
        <div class="stars">${'★'.repeat(Math.min(5,g.r+1))}</div>
        <div class="kicker">ILVL ${g.ilvl} · +${g.plus}/10</div>
      </div>
    </div>
    <div class="mini" style="margin:10px 0">
      <div class="card"><div class="kicker">Attacco</div><b>${g.atk + g.plus*3}</b></div>
      <div class="card"><div class="kicker">Difesa</div><b>${g.def + g.plus*2}</b></div>
    </div>
    <div class="card" style="margin-bottom:10px;font-size:12px;color:var(--muted)">
      Ogni +1 aumenta attacco e difesa. A +4 / +7 / +10 il pezzo cambia silhouette e intensità del bagliore.
      Rarità più alta = mesh più lavorata in 3D (creste, rune, particelle).
    </div>
    <div class="mini">
      <button class="btn btn-c" onclick="upgrade('${key}',${cost})">+1 · ${cost} polvere (hai ${S.dust})</button>
      <button class="btn btn-g" onclick="reroll('${key}')">RICALIBRA AFFISSI</button>
    </div>
    <button class="btn btn-g" style="width:100%;margin-top:8px" onclick="closeSheet()">Chiudi</button>
  </div>`;
}
function closeSheet(){document.getElementById('sheet').className='sheet'}
function upgrade(key, cost){
  const g=S.gear[key];
  if(g.plus>=10){toast('Già +10');return}
  if(S.dust<cost){toast('Polvere insufficiente');return}
  S.dust-=cost; g.plus++;
  S.q.upgrades++;
  if(g.plus===4||g.plus===7||g.plus===10) toast(g.name+' cambia forma');
  else toast(g.name+' +'+g.plus);
  openItem(key); if(S.tab==='char') render();
}
function reroll(key){
  const g=S.gear[key];
  g.atk = Math.max(0, g.atk + Math.floor(Math.random()*7-3));
  g.def = Math.max(0, g.def + Math.floor(Math.random()*7-3));
  toast('Affissi ricalibrati'); openItem(key);
}

function render(){
  const map={hunt:huntView,char:charView,world:worldView,order:orderView};
  document.getElementById('view').innerHTML = map[S.tab]();
}
loadSave();
render();
requestAnimationFrame(bootThree);
setInterval(()=>{
  if(S.energy<S.energyMax){ S.energy++; const en=document.getElementById('enVal'); if(en) en.textContent=S.energy; }
  if(S.auto && !S.fighting && S.tab==='hunt' && S.energy>=2) startFight();
}, 3500);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
